name: CI — Build, Test, Push

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  # Image names MUST be lowercase for GHCR. This expression ensures the owner is lowercased.
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: "21"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Unit + Integration Tests
  # ubuntu-latest has Docker pre-installed — Testcontainers works without
  # any additional configuration.
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Test (Java 21)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run unit and integration tests
        run: mvn verify -P integration --no-transfer-progress
        # Testcontainers spins up real PostgreSQL + Redis containers.
        # The Docker socket is available on ubuntu-latest runners by default.

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/failsafe-reports/

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Build and push Docker image to GHCR
  # Only runs on main branch push (not PRs)
  # ──────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push (Distroless)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase repository name
        id: lowercaseRepo
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build application (skip tests — already ran in test job)
        # This produces:
        #   target/classes/  → application bytecode
        #   target/dependency/ → runtime deps (via maven-dependency-plugin)
        # Both are copied into the Docker image by the multi-stage Dockerfile.
        run: mvn package -DskipTests --no-transfer-progress

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: abdennasserbentaleb
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/abdennasserbentaleb/multi-tenant-saas-prod
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build platform matches k3s Alpine Linux nodes (amd64)
          platforms: linux/amd64
